name: Phaser 4 visual lab checks
on:
  pull_request:
    paths:
      - 'phaser-lab/**'
      - 'gateway/visible-map-projection.mjs'
      - 'gateway/visible-map-projection.test.mjs'
      - 'gateway/owned-map-session.mjs'
      - 'gateway/owned-map-session.test.mjs'
      - 'gateway/map-session-http.mjs'
      - '.github/workflows/phaser-lab-checks.yml'
  push:
    paths:
      - 'phaser-lab/**'
      - 'gateway/visible-map-projection.mjs'
      - 'gateway/visible-map-projection.test.mjs'
      - 'gateway/owned-map-session.mjs'
      - 'gateway/owned-map-session.test.mjs'
      - 'gateway/map-session-http.mjs'
      - '.github/workflows/phaser-lab-checks.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check phaser-lab/game.mjs
          node --check phaser-lab/office-model.mjs
          node --check phaser-lab/office-model.test.mjs
          node --check phaser-lab/boot.test.mjs
          node --check phaser-lab/authority/main.mjs
          node --check phaser-lab/authority/view-contract.mjs
          node --check phaser-lab/authority/sample-snapshots.mjs
          node --check gateway/visible-map-projection.mjs
          node --check gateway/owned-map-session.mjs
          node --check gateway/map-session-http.mjs
          node --check phaser-lab/authority/live-map-client.mjs
      - name: Source topology and route tests
        run: node --test phaser-lab/*.test.mjs phaser-lab/authority/*.test.mjs gateway/visible-map-projection.test.mjs gateway/owned-map-session.test.mjs
      - name: Verify static route entry
        run: |
          test -s phaser-lab/index.html
          grep -q 'phaser-lab' phaser-lab/README.md || grep -q 'Phaser 4' phaser-lab/README.md
          grep -q 'game.mjs' phaser-lab/index.html
  browser:
    name: Real-browser Phaser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium
      - name: Render and interact in Chromium
        run: node phaser-lab/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterlife-office-v2-preview
          path: |
            phaser-lab/artifacts/office-v2.png
            phaser-lab/artifacts/authority-projection.png
          if-no-files-found: ignore
          retention-days: 7
