name: Cards integration checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/authoritative-game-gateway-m1, feat/canonical-scene-card-model]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run contract tests
        run: node --test tests/*.test.mjs
